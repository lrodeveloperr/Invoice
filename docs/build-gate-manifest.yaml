  - id: REQ-BILLING-001
    scope: LAUNCH
    status: LOCKED
    owner: Persistence
    normative_text: "A visit shall have at most one active issued-invoice link."
    evidence: ["process-flow:complaint-derived-7"]
    risk: critical
    acceptance_test_ids: [T-ISSUE-001, T-PROPERTY-001]
    dependencies: []
  - id: REQ-SNAPSHOT-001
    scope: LAUNCH
    status: LOCKED
    owner: Persistence
