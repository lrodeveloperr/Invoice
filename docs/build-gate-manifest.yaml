    acceptance_test_ids: [T-QUALITY-001]
    dependencies: []

tests:
  - id: T-PLATFORM-001
    requirement_ids: [REQ-PLAT-001]
    platform_matrix: [ios17_iphone]
    fixture_ids: [REVIEWER-SAMPLE-01]
    starting_state: "Clean installation on the reference device."
    actions: [install, launch, record_visit, build_preview, issue_free_invoice, export_backup]
    expected_oracle: "Every action completes without crash and produces the declared records and file."
    severity_on_failure: high
    automation_status: planned
  - id: T-LOCALE-001
    requirement_ids: [REQ-LOC-001, REQ-LOC-002]
    platform_matrix: [ios17_iphone]
    fixture_ids: [LOCALE-SWITCH-01]
    starting_state: "New install on an English-language device."
    actions: [launch, assert_japanese, switch_to_english, inspect_all_visible_destinations, relaunch]
    expected_oracle: "Japanese is initial; English replaces all current interface strings without restart and persists after relaunch."
