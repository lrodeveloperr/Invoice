manifest_version: 1
project:
  id: dated-service-invoice-japan
  japanese_name: "日付別請求書・作業明細"
  english_name: "Dated Service Invoice"
  artifact_date: "2026-09-27"
  phase: preimplementation
  status: READY_TO_IMPLEMENT
  implementation_present: false

support_matrices:
  platform:
    - id: ios17_iphone
      platform: iOS
      minimum_version: "17.0"
      device_family: iPhone
      reference_device: "iPhone SE (2nd generation)"
      supported: true
    - id: ipad
      platform: iPadOS
      supported: false
      scope: EXCLUDED
    - id: mac
      platform: macOS
      supported: false
      scope: EXCLUDED
  locale:
    - id: ja_JP
      interface_language: Japanese
      default: true
      currency: JPY
      calendar: gregorian
    - id: en_control
      interface_language: English
      default: false
      currency: JPY
      calendar: gregorian
      note: "Owner control layer; it does not translate an existing issued snapshot."
  entitlement:
    - id: free_unused
      pro: false
      clean_invoice_used: false
      active_customer_limit: 2
      new_clean_issue_allowed: true
    - id: free_used
      pro: false
      clean_invoice_used: true
      active_customer_limit: 2
      new_clean_issue_allowed: false
    - id: pro
      pro: true
      clean_invoice_used: any
      active_customer_limit: unlimited
      new_clean_issue_allowed: true
    - id: revoked
      pro: false
      clean_invoice_used: persisted
      existing_data_access: true
  input_profiles:
    - id: normal_repeat_visit
      quantity_scale: "0...3"
      line_count: "1...10"
      visit_count: "1...100"
    - id: boundary_invoice
      quantity_max: "999999.999"
      unit_price_yen_max: 999999999
      invoice_total_yen_max: 9999999999999
    - id: hostile_import
      formats: [malformed_json, bad_hash, path_traversal, symlink, newer_schema]

definitions:
  active_customer: "A customer row whose active flag is true; deactivated customers do not count toward the free capacity."
  clean_invoice: "An issued canonical PDF without the preview watermark."
  complete_backup: "A package containing every live and historical domain record, every canonical issued PDF, schema metadata, record counts and hashes; StoreKit entitlement is excluded."
  compatible_backup: "A package whose schema version is at most the newest supported version and has a registered migration path to the current schema."
  deterministic_calculation: "For identical normalized inputs and stored policies, all integer yen outputs and validation results are identical."
  exact_preview: "The issued preview and subsequent share load the same stored PDF file bytes identified by the same SHA-256 hash."
  historical_date: "Any valid Gregorian LocalDate accepted by the storage bounds, independent of the device's current month."
  immediate_language_switch: "All currently visible localizable UI strings refresh before the next user action and without process restart."
  large_dataset: "10,000 visits, 30,000 visit lines, 1,000 issued invoices and 1,000 canonical PDFs."
  recent_staged_file: "A file-operation journal artifact created less than 24 elapsed hours before recovery begins."
  readable_pdf_text: "Body font size is at least 9 PDF points and no glyph bounding box crosses the 36-point page margins."
  successful_issue: "The database snapshot, source links, billed states, allowance state and readable canonical PDF are all present and mutually consistent."

fixtures:
  - id: CALC-MIXED-01
    description: "0%, 8% and 10% lines with fractional quantities under floor, half-up and ceiling policies."
  - id: CALC-BOUNDARY-01
    description: "Zero price, maximum quantity/price/total and one-yen overflow cases."
  - id: FLOW-100-01
    description: "100 unbilled visits on non-consecutive dates across four sites."
  - id: PDF-JA-LONG-01
    description: "Japanese descriptions, uncommon kanji, emoji, combining marks and multi-page totals."
  - id: PDF-EN-LONG-01
    description: "English control strings expanded to 200% of Japanese source length."
  - id: RECOVERY-ISSUE-01
    description: "Fault injection before and after every issue-protocol boundary."
  - id: BACKUP-CLEAN-01
    description: "Valid complete backup with PDFs and hashes."
  - id: BACKUP-HOSTILE-01
    description: "Malformed JSON, missing PDF, bad hash, path traversal, symlink and newer schema variants."
  - id: MIGRATION-ALL-01
    description: "One database fixture for every released schema version and a current-schema target."
  - id: STOREKIT-ALL-01
    description: "Success, cancelled, pending, unverified, interrupted, revoked, restored and offline product-load states."
  - id: PERF-LARGE-01
    description: "The declared large dataset with 500 lines in the selected invoice."
  - id: LOCALE-SWITCH-01
    description: "Japanese first launch, English switch, relaunch, clock/time-zone changes and existing issued snapshots."
  - id: REVIEWER-SAMPLE-01
    description: "Resettable Japanese sample customer, site, visits and draft invoice."

performance_budgets:
  environment:
    build_configuration: Release
    device: "iPhone SE (2nd generation)"
    os: "oldest supported iOS"
    warmup_runs: 1
    measured_runs: 20
    percentile: p95
  budgets:
    cold_launch_to_ledger_ms: 1500
    first_100_ledger_rows_ms: 100
    persisted_edit_after_debounce_ms: 150
    calculate_100_visits_500_lines_ms: 50
    render_100_visits_500_lines_ms: 2000
    issue_excluding_share_ms: 2500
    export_large_backup_ms: 15000
    restore_large_backup_ms: 30000
    pdf_peak_memory_mib: 150
    database_metadata_mib: 100

simulation:
  deterministic_seeds: [1701, 20260927, 4294967291]
  generated_sequences_per_critical_invariant: 10000
  simulated_date_span:
    start: "2000-01-01"
    end: "2125-12-31"
  event_volumes:
    visits: 100000
    invoice_attempts: 25000
    restore_attempts: 5000
    entitlement_events: 10000
  data_growth_curve: "0 to PERF-LARGE-01 in 120 monthly steps, then 10 years of edit/issue/void/restore events."
  state_oracles:
    - "A visit has at most one active issued-invoice link."
    - "A successful issued invoice has one readable canonical PDF with matching hash."
    - "Issued snapshot fields never change after issue."
    - "Invoice numbers are unique and the allocation counter never decreases."
    - "Grand total equals rate subtotals plus once-per-rate rounded tax."
    - "A failed or cancelled purchase never grants Pro or changes domain data."
    - "A restore failure leaves the pre-restore database and files byte-for-byte intact."

tool_thresholds:
  compiler:
    language_mode: "Swift 6"
    strict_concurrency: complete
    warnings_as_errors: true
    xcode_policy: "Latest stable non-beta Xcode at implementation start; exact build recorded in candidate manifest."
  dependencies:
    runtime_allowlist:
      - name: GRDB.swift
        exact_version: "7.11.1"
    package_resolved_committed: true
    block_known_vulnerabilities: [critical, high]
    license_scan_required: true
    secret_scan_required: true
  coverage:
    critical_module_line_percent_min: 95
    critical_branch_percent_min: 90
    direct_test_for_every_critical_invariant: true
  mutation:
    critical_module_score_percent_min: 80
    approved_alternative: "Scripted branch mutations that change each critical predicate and prove at least one linked test fails."
  fuzz:
    untrusted_parser_minutes_each_min: 30
    deterministic_seed_required: true
  sanitizers:
    address: required_where_supported
    undefined_behavior: required_where_supported
    thread: required_where_supported

requirements:
  - id: REQ-PLAT-001
    scope: LAUNCH
    status: LOCKED
    owner: AppShell
    normative_text: "The production app shall install and complete the primary workflow on every iPhone running iOS 17.0 or later."
    evidence: ["process-flow:primary-launch-customer", "apple:swiftui"]
    risk: high
    acceptance_test_ids: [T-PLATFORM-001]
    dependencies: []
  - id: REQ-LOC-001
    scope: LAUNCH
    status: LOCKED
    owner: Localization
    normative_text: "A new installation shall select Japanese as its in-app display language."
    evidence: ["listing:japan-localization"]
    risk: high
    acceptance_test_ids: [T-LOCALE-001]
    dependencies: [REQ-PLAT-001]
  - id: REQ-LOC-002
    scope: LAUNCH
    status: LOCKED
    owner: Localization
    normative_text: "Selecting English in Display Language shall replace every currently visible localizable interface string before the next user action without restarting the process."
    evidence: ["owner:english-control-layer", "apple:string-catalogs"]
    risk: high
    acceptance_test_ids: [T-LOCALE-001, T-LOCALE-002]
    dependencies: [REQ-LOC-001]
  - id: REQ-OFFLINE-001
    scope: LAUNCH
    status: LOCKED
    owner: Architecture
    normative_text: "Recording visits, building, previewing, issuing, viewing and backing up invoices shall require no network connection or account."
    evidence: ["process-flow:complaint-derived-8"]
    risk: critical
    acceptance_test_ids: [T-OFFLINE-001]
    dependencies: []
  - id: REQ-DATE-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "Each visit shall store its work date as Gregorian year, month and day independently of creation timestamp and device time zone."
    evidence: ["process-flow:complaint-derived-1"]
    risk: critical
    acceptance_test_ids: [T-DATE-001]
    dependencies: []
  - id: REQ-MONEY-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "Every persisted monetary amount shall be a checked Int64 count of whole yen and shall never be a binary floating-point value."
    evidence: ["process-flow:data-calculation-model"]
    risk: critical
    acceptance_test_ids: [T-CALC-001, T-CALC-002]
    dependencies: []
  - id: REQ-QTY-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "A quantity shall be greater than zero, no greater than 999999.999 and contain at most three decimal places."
    evidence: ["decision-register:quantity-contract"]
    risk: high
    acceptance_test_ids: [T-CALC-002]
    dependencies: []
  - id: REQ-LINE-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "A line net amount shall equal exact decimal quantity multiplied by tax-exclusive unit-price yen and rounded to whole yen by the stored line-rounding rule."
    evidence: ["decision-register:tax-exclusive"]
    risk: critical
    acceptance_test_ids: [T-CALC-001, T-CALC-002]
    dependencies: [REQ-MONEY-001, REQ-QTY-001]
  - id: REQ-TAX-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "Invoice tax shall be calculated and rounded exactly once for each distinct tax rate after summing the whole-yen net values assigned to that rate."
    evidence: ["nta:no-6371", "process-flow:complaint-derived-6"]
    risk: critical
    acceptance_test_ids: [T-CALC-001, T-PROPERTY-001]
    dependencies: [REQ-LINE-001]
  - id: REQ-TAX-002
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "The launch rate catalog shall offer 10%, 8% and 0% as versioned basis-point records."
    evidence: ["process-flow:release-gate-5"]
    risk: high
    acceptance_test_ids: [T-CALC-001]
    dependencies: [REQ-TAX-001]
  - id: REQ-TOTAL-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "An invoice grand total shall equal the sum of every rate subtotal and its stored rounded tax amount and shall not exceed 9999999999999 yen."
    evidence: ["decision-register:amount-bounds"]
    risk: critical
    acceptance_test_ids: [T-CALC-002, T-PROPERTY-001]
    dependencies: [REQ-TAX-001]
  - id: REQ-AUTOSAVE-001
    scope: LAUNCH
    status: LOCKED
    owner: Persistence
    normative_text: "A valid visit or invoice-draft edit shall be persisted 250 milliseconds after the latest edit or immediately when the scene becomes inactive, whichever occurs first."
    evidence: ["process-flow:complaint-derived-5"]
    risk: high
    acceptance_test_ids: [T-AUTOSAVE-001]
    dependencies: []
  - id: REQ-SELECT-001
    scope: LAUNCH
    status: LOCKED
    owner: Domain
    normative_text: "An invoice draft shall accept individually selected unbilled visits for one customer from any valid historical dates, including non-consecutive dates."
    evidence: ["process-flow:complaint-derived-2"]
    risk: critical
    acceptance_test_ids: [T-INVOICE-BUILD-001]
